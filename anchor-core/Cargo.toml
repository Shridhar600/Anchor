[package]
name = "anchor-core"
version = "0.1.0"
edition = "2021"
description = "Anchor — local-first dev project & thread tracker (data layer)."
repository = "https://github.com/Shridhar600/Anchor"
license = "MIT"

[dependencies]
rusqlite = { version = "=0.39.0", features = ["bundled"] }
rusqlite_migration = "=2.5.0"
thiserror = "=2.0.18"
serde = { version = "=1.0.228", features = ["derive"] }

[dev-dependencies]
serde_json = "=1.0.150"

