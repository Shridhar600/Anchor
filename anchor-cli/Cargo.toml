[package]
name = "anchor-cli"
version = "0.1.0"
edition = "2021"
description = "Anchor — local-first dev project & thread tracker (CLI)."
repository = "https://github.com/Shridhar600/Anchor"
license = "MIT"

[[bin]]
name = "anchor"
path = "src/main.rs"

[dependencies]
anchor-core = { path = "../anchor-core" }
clap = { version = "=4.6.1", features = ["derive"] }
directories = "=6.0.0"
serde = "=1.0.228"
serde_json = "=1.0.149"

[dev-dependencies]
assert_cmd = "=2.1.2"
tempfile = "=3.21.0"
